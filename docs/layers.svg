<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Space Grotesk, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1A9B0"/><stop offset=".2" stop-color="#E9A6D2"/><stop offset=".4" stop-color="#C3A5DD"/>
      <stop offset=".6" stop-color="#A3A9E6"/><stop offset=".8" stop-color="#CFE19C"/><stop offset="1" stop-color="#F6BE8A"/>
    </linearGradient>
    <style>
      .bg { fill: #F0F0F1 }
      .card { fill: #F7F7F8; stroke: #B4B6BA }
      .feat { fill: #F7F7F8; stroke: #C3A5DD; stroke-width: 2 }
      .off { fill: #F7F7F8; stroke: #B4B6BA; stroke-dasharray: 5 5; opacity: .55 }
      .live { stroke: #8E95DB; stroke-width: 2; fill: none }
      .cut { stroke: #B4B6BA; stroke-width: 1.5; fill: none; stroke-dasharray: 5 6 }
      .t { fill: #0A0B0D; font-size: 14px; font-weight: 500 }
      .s { fill: #54575C; font-size: 11.5px }
      .cap { fill: #54575C; font-size: 11px; letter-spacing: .14em }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0A0B0D } .card, .feat, .off { fill: #16181C } .card { stroke: #3A3D43 }
        .t { fill: #F0F0F1 } .s, .cap { fill: #989DA4 } .live { stroke: #A3A9E6 } .cut { stroke: #3A3D43 }
      }
    </style>
  </defs>
  <rect class="bg" width="880" height="400" rx="16"/>
  <rect y="0" width="880" height="4" fill="url(#foil)"/>

  <text class="cap" x="32" y="30">LAYER 1 · CORE</text>
  <text class="cap" x="32" y="130">LAYER 2 · FEATURES</text>
  <text class="cap" x="32" y="250">LAYER 3 · ELEMENTS</text>

  <!-- cords -->
  <path class="live" d="M440 86 C440 120 230 110 230 142"/>
  <path class="live" d="M440 86 C440 120 440 110 440 142"/>
  <path class="cut" d="M440 86 C440 120 650 110 650 142"/>
  <path class="live" d="M230 186 C230 230 120 220 120 262"/>
  <path class="live" d="M230 186 C230 230 330 220 330 262"/>
  <path class="live" d="M440 186 C440 230 330 220 330 262"/>
  <path class="live" d="M440 186 C440 230 540 220 540 262"/>
  <path class="cut" d="M650 186 C650 230 760 220 760 262"/>

  <!-- core -->
  <rect x="320" y="40" width="240" height="48" rx="8" fill="url(#foil)" stroke="rgba(10,11,13,.14)"/>
  <text x="440" y="62" text-anchor="middle" fill="#0A0B0D" font-size="15" font-weight="700">your-project</text>
  <text x="440" y="79" text-anchor="middle" fill="#0A0B0D" font-size="11.5">CLAUDE.md · package.json · README</text>

  <!-- features -->
  <rect class="feat" x="150" y="142" width="160" height="44" rx="8"/>
  <text class="t" x="166" y="162">ui</text><text class="s" x="166" y="178">src/ui/ · attached</text>
  <rect class="feat" x="360" y="142" width="160" height="44" rx="8"/>
  <text class="t" x="376" y="162">api</text><text class="s" x="376" y="178">src/api/ · attached</text>
  <rect class="off" x="570" y="142" width="160" height="44" rx="8"/>
  <text class="t" x="586" y="162">billing</text><text class="s" x="586" y="178">src/billing/ · detached</text>

  <!-- elements -->
  <rect class="card" x="50" y="262" width="140" height="44" rx="8"/>
  <text class="t" x="66" y="282">App.tsx</text><text class="s" x="66" y="298">Code · ~1.2k</text>
  <rect class="card" x="250" y="262" width="160" height="44" rx="8" stroke="#E9A6D2" stroke-width="2"/>
  <text class="t" x="266" y="282">format.ts</text><text class="s" x="266" y="298">Shared by ui and api</text>
  <rect class="card" x="470" y="262" width="140" height="44" rx="8"/>
  <text class="t" x="486" y="282">server.ts</text><text class="s" x="486" y="298">Code · ~2.0k</text>
  <rect class="off" x="690" y="262" width="140" height="44" rx="8"/>
  <text class="t" x="706" y="282">invoice.ts</text><text class="s" x="706" y="298">skipped, saves ~3.1k</text>

  <text class="s" x="32" y="350">Solid cords are in the thread's context window. Dashed cords are detached: Claude skips them unless asked.</text>
  <text class="s" x="32" y="370">A shared element sits between every feature that imports it, so detaching one feature never cuts it off from the others.</text>
</svg>
